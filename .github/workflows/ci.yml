name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers (Postgres, RabbitMQ) uses the Docker daemon of the runner.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Build Docker image
        run: docker build -t rule-service:ci .

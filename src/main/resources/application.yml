spring:
  application:
    name: rule-service
  autoconfigure:
    exclude:
      # Tracing is part of the application only when TRACING_ENABLED=true: TracingConfig imports this back in then.
      - org.springframework.boot.actuate.autoconfigure.tracing.OpenTelemetryTracingAutoConfiguration
  http:
    client:
      # HttpURLConnection like before (no selector threads): Boot's RestClient.Builder, which the lookup-service client now starts from so
      # that its calls are observed and carry traceparent, would otherwise build a JDK HttpClient first.
      factory: simple
  web:
    locale: en                    # texts of API errors: Accept-Language decides, English when it is missing or unknown
    locale-resolver: accept-header
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parkview}
    username: ${DB_USER:svc_rule}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1500000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:rules}
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # the tables of this service and Liquibase's own tracking tables live in its schema (ADR 0010): the schema and the role
    # (search_path = rules, public) are created by the infrastructure
    default-schema: ${DB_SCHEMA:rules}
    liquibase-schema: ${DB_SCHEMA:rules}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        observation-enabled: ${TRACING_ENABLED:false}   # listeners continue the publisher's trace
        prefetch: 20
        default-requeue-rejected: false
        retry:
          enabled: true
          # ~2.5 min in total (2s, 6s, 18s, 54s, 60s between 6 attempts): long enough for a database restart or failover, so that
          # payment.completed.fine is not dead-lettered by a blip while the money is already taken
          initial-interval: ${RABBIT_RETRY_INITIAL_INTERVAL:2s}
          multiplier: ${RABBIT_RETRY_MULTIPLIER:3.0}
          max-interval: ${RABBIT_RETRY_MAX_INTERVAL:60s}
          max-attempts: ${RABBIT_RETRY_MAX_ATTEMPTS:6}
    template:
      observation-enabled: ${TRACING_ENABLED:false}   # publishes inject traceparent into the message headers
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  compression:
    enabled: true
    min-response-size: 2KB
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  # Distributed tracing. Off unless TRACING_ENABLED=true: with it off there is no tracer, no exporter, no trace
  # headers and no connection attempt (see TracingConfig). W3C traceparent over HTTP and AMQP; actuator spans are not exported.
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces}

springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${DOCS_ENABLED:false}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"

parkview:
  docs:
    description: Parking violations, permits and fines
  security:
    issuer: ${SUPABASE_URL}/auth/v1
    audience: ${SUPABASE_AUDIENCE:authenticated}
    # the OWN key of this service (callers hold it as RULE_INTERNAL_API_KEY); the previous one is accepted too during a rotation
    internal-api-key: ${INTERNAL_API_KEY:}
    internal-api-key-previous: ${INTERNAL_API_KEY_PREVIOUS:}
    ops-api-key: ${OPS_API_KEY:}                  # non-health actuator (prometheus) and retention endpoints
    public-paths: []
  outbox:
    unroutable-retry-window: ${OUTBOX_UNROUTABLE_RETRY_WINDOW:PT5M}   # an unroutable event is retried this long (consumer queue not declared yet), then parked
  rule-engine:
    iou-threshold: 0.85
    containment-threshold: 0.90
    min-overlap: 0.5
    default-boundary-grace-minutes: 10
    default-permit-grace-minutes: 30
    no-parking-grace-minutes: 5
    overstay-grace-minutes: 5
    wrong-vehicle-type-grace-minutes: 10
    # fine amounts per currency (ISO 4217) and violation type; a fine is issued in the currency of its site, and a currency without
    # amounts here gets no fine (the violation stays open, ERROR log and counter ruleengine.fines.not_issued)
    fine-amounts:
      SEK:
        no-parking: 900
        overstay: 450
        wrong-permit: 700
        boundary-exceeded: 900
        wrong-vehicle-type: 700
    expire-sweep-ms: 60000
    expire-batch-size: 20
    stale-minutes: 15
    fine-freshness-seconds: 120
    stale-sweep-ms: 60000
    touch-interval-seconds: 10
    spot-cache-ttl-minutes: 5
    spot-cache-negative-ttl-seconds: 15
    observation-max-age-seconds: 600
    refine-block-hours: 6
    rule-cache-ttl-seconds: 60
    vehicle-lookup-enabled: true
    # a violation whose fine cannot be issued (site without currency, no fine amount) is left out of the fine sweep this long (ISO-8601 or 30m style)
    fining-retry-delay: ${FINING_RETRY_DELAY:PT15M}
  lookup:
    base-url: ${LOOKUP_SERVICE_URL:http://localhost:8089}
    connect-timeout-ms: 500
    read-timeout-ms: 1500
    cache-ttl-minutes: 60
    negative-cache-ttl-seconds: 60
    cache-max-size: 10000
    internal-api-key: ${LOOKUP_INTERNAL_API_KEY:}   # the key of lookup-service; no fallback to INTERNAL_API_KEY
  access:
    plates-cache-ttl: ${PLATES_CACHE_TTL:30s}        # registered plates of a driver (identity.v_user_plates)
    plates-cache-max: ${PLATES_CACHE_MAX:10000}
    sites-cache-ttl: ${SITES_CACHE_TTL:30s}          # sites of an operator (identity.v_user_sites); a change applies within this time
    sites-cache-max: ${SITES_CACHE_MAX:10000}
  # Data retention of fines and violations (README, "Data retention"). Off and dry-run by default. The periods have NO default: they are a
  # legal and product decision, and all three are required once enabled=true (examples are in the README). 25m = 25 months, 760d, 2y1m.
  retention:
    enabled: ${RETENTION_ENABLED:false}
    dry-run: ${RETENTION_DRY_RUN:true}          # true: only count and log what a real run would do
    cron: ${RETENTION_CRON:0 25 3 * * *}        # every night at 03:25 (server time zone)
    batch-size: ${RETENTION_BATCH_SIZE:1000}    # rows per transaction
    max-batches: ${RETENTION_MAX_BATCHES:200}   # per step and run; the rest waits for the next night
    # evidence, closed-records and violations (PARKVIEW_RETENTION_EVIDENCE, PARKVIEW_RETENTION_CLOSED_RECORDS, PARKVIEW_RETENTION_VIOLATIONS)
    # are deliberately not set here: without them the service refuses to start with retention enabled

# Texts of API errors of this service, English base: complete for the service's own keys. The keys that every service has
# (title.notFound, title.conflict, error.forbidden, error.unauthorized, error.validation.*, Bean Validation defaults ...) are in the
# platform bundle messages/parkview-errors*.properties of parkview-web, chained as the parent of this one; a key here overrides it.
# The rest are the codes of this service (<area>.<reason>, lower camelCase, stable: clients may switch on them) and the
# validation.* texts of the DTO annotations. {0} is a parameter. Apostrophes are avoided on purpose: a message without
# parameters is used as it is, one with parameters goes through MessageFormat, where a literal apostrophe is written ''.
# Keep errors_sv.properties in step: every key of this file must exist there (ErrorMessagesBundleTest).

# not found (notFound.<resource>, spaces of the resource name as '-'); {0} is the id
notFound.fine=Fine not found: {0}
notFound.dispute=Dispute not found: {0}
notFound.dispute-of-fine=Dispute of fine not found: {0}
notFound.permit=Permit not found: {0}
notFound.violation=Violation not found: {0}

# disputes
dispute.fineAlreadyPaid=This fine has already been paid, so it can no longer be disputed.
dispute.fineVoided=This fine has been cancelled, so there is nothing to dispute.
dispute.alreadyOpen=A review of this fine has already been requested and is still open.
dispute.alreadyUpheld=This fine has already been reviewed by an operator and the fine stands.
dispute.withdrawn=This dispute has been withdrawn and cannot be changed.
dispute.alreadyDecided=This dispute has already been decided and cannot be changed.

# fines
fine.voidPaid=A paid fine cannot be voided; refunds are a separate process
fine.payVoided=A voided fine cannot be marked as paid
fine.payUnderReview=This fine is under review: decide the dispute before marking the fine as paid

# violations
violation.fineAlreadyIssued=A fine has already been issued for this violation

# permits
permit.plateEmpty=Plate must not be empty
permit.validToNotAfterValidFrom=validTo must be after validFrom

# sites and zones (ADR 0009)
zone.otherSite=The zone belongs to another site

# validation (DTO annotations: message = "{validation.<rule>}"; the standard constraints (NotBlank, Size, NotNull) are answered
# by the platform bundle, so the text is English or Swedish and never the one of another language the validator happens to ship)
validation.plateCharacters=must contain only letters, digits, spaces and dashes
validation.disputeOutcome=must be upheld or voided
validation.paidMethod=must be one of cash, transfer, other
validation.disputeStatusFilter=must be open, decided or all
validation.siteOrZone=must name a site or a zone

# Svenska texter för API-fel. Samma nycklar som i errors.properties; saknas en nyckel används den engelska texten (de gemensamma
# nycklarna finns i plattformens paket messages/parkview-errors_sv.properties).
# Ordval som i webbens texter: bot, makulera, invändning, granskning, handläggare, skylt, överträdelse.

# not found
notFound.fine=Boten hittades inte: {0}
notFound.dispute=Invändningen hittades inte: {0}
notFound.dispute-of-fine=Invändningen mot boten hittades inte: {0}
notFound.permit=Tillståndet hittades inte: {0}
notFound.violation=Överträdelsen hittades inte: {0}

# disputes
dispute.fineAlreadyPaid=Boten är redan betald, så det går inte längre att invända mot den.
dispute.fineVoided=Boten har makulerats, så det finns inget att invända mot.
dispute.alreadyOpen=En granskning av boten har redan begärts och är fortfarande öppen.
dispute.alreadyUpheld=Boten har redan granskats av en handläggare och kvarstår.
dispute.withdrawn=Invändningen har återkallats och kan inte ändras.
dispute.alreadyDecided=Invändningen har redan avgjorts och kan inte ändras.

# fines
fine.voidPaid=En betald bot kan inte makuleras; återbetalningar sköts i en separat process
fine.payVoided=En makulerad bot kan inte markeras som betald
fine.payUnderReview=Boten är under granskning: avgör invändningen innan boten markeras som betald

# violations
violation.fineAlreadyIssued=En bot har redan utfärdats för den här överträdelsen

# permits
permit.plateEmpty=Skylten får inte vara tom
permit.validToNotAfterValidFrom=Slutet på giltigheten (validTo) måste vara efter början (validFrom)

# platser och zoner (ADR 0009)
zone.otherSite=Zonen hör till en annan anläggning

# validation
validation.plateCharacters=får bara innehålla bokstäver, siffror, mellanslag och bindestreck
validation.disputeOutcome=måste vara upheld eller voided
validation.paidMethod=måste vara någon av cash, transfer, other
validation.disputeStatusFilter=måste vara open, decided eller all
validation.siteOrZone=måste ange en anläggning eller en zon

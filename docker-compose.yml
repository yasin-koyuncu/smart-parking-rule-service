version: "3.9"

services:

  # ── Infrastruktur ────────────────────────────────────────────────────────────

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB:       parkview
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot-tjänster ─────────────────────────────────────────────────────

  api-gateway:
    build: ./spring-services/api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT:                8080
      RULE_ENGINE_URL:     http://rule-engine:8081
      SESSION_SERVICE_URL: http://session-service:8082
      AI_SERVICE_URL:      http://ai-service:8000
      SUPABASE_URL:        ${SUPABASE_URL}
      FRONTEND_URL:        ${FRONTEND_URL:-http://localhost:5173}
      REDIS_HOST:          redis
      REDIS_PORT:          6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  rule-engine:
    build: ./spring-services/rule-engine
    ports:
      - "8081:8081"
    environment:
      PORT:        8081
      DB_URL:      jdbc:postgresql://postgres:5432/parkview
      DB_USER:     postgres
      DB_PASS:     postgres
      RABBIT_HOST: rabbitmq
      REDIS_HOST:  redis
      REDIS_PORT:  6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  session-service:
    build: ./spring-services/session-service
    ports:
      - "8082:8082"
    environment:
      PORT:        8082
      DB_URL:      jdbc:postgresql://postgres:5432/parkview
      DB_USER:     postgres
      DB_PASS:     postgres
      RABBIT_HOST: rabbitmq
      REDIS_HOST:  redis
      REDIS_PORT:  6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  parking-mapping:
    build: ./spring-services/parking-mapping
    ports:
      - "8083:8083"
    environment:
      PORT:        8083
      DB_URL:      jdbc:postgresql://postgres:5432/parkview
      DB_USER:     postgres
      DB_PASS:     postgres
      RABBIT_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  event-streaming:
    build: ./spring-services/event-streaming
    ports:
      - "8084:8084"
    environment:
      PORT:        8084
      RABBIT_HOST: rabbitmq
      SUPABASE_URL: ${SUPABASE_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy

  lookup-service:
    build: ./spring-services/lookup-service
    ports:
      - "8089:8089"
    environment:
      PORT:                         8089
      REDIS_HOST:                   redis
      REDIS_PORT:                   6379
      SUPABASE_URL:                 ${SUPABASE_URL}
      TRANSPORTSTYRELSEN_API_KEY:   ${TRANSPORTSTYRELSEN_API_KEY:-}
      TRANSPORTSTYRELSEN_URL:       ${TRANSPORTSTYRELSEN_URL:-https://fordonsuppgifter.transportstyrelsen.se/fordonsuppgifter/v1}
      LOOKUP_MOCK_ENABLED:          ${LOOKUP_MOCK_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy

  notification-service:
    build: ./spring-services/notification-service
    ports:
      - "8087:8087"
    environment:
      PORT:                  8087
      DB_URL:                jdbc:postgresql://postgres:5432/parkview
      DB_USER:               postgres
      DB_PASS:               postgres
      RABBIT_HOST:           rabbitmq
      TWILIO_ACCOUNT_SID:    ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN:     ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER:    ${TWILIO_FROM_NUMBER:-}
      SENDGRID_API_KEY:      ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL:   ${SENDGRID_FROM_EMAIL:-noreply@parkview.se}
      SMS_ENABLED:           ${SMS_ENABLED:-false}
      EMAIL_ENABLED:         ${EMAIL_ENABLED:-false}
      PUSH_ENABLED:          ${PUSH_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    build: ./spring-services/payment-service
    ports:
      - "8088:8088"
    environment:
      PORT:                   8088
      DB_URL:                 jdbc:postgresql://postgres:5432/parkview
      DB_USER:                postgres
      DB_PASS:                postgres
      RABBIT_HOST:            rabbitmq
      SUPABASE_URL:           ${SUPABASE_URL}
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      FRONTEND_URL:           ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-service:
    build: ./python-ai
    ports:
      - "8000:8000"
    environment:
      SUPABASE_URL:         ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
    volumes:
      - ./python-ai/models:/app/models   # delade modeller

  auth-service:
    build: ./spring-services/auth-service
    ports:
      - "8085:8085"
    environment:
      PORT:              8085
      SUPABASE_URL:      ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}

  file-service:
    build: ./spring-services/file-service
    ports:
      - "8086:8086"
    environment:
      PORT:             8086
      MINIO_URL:        http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SUPABASE_URL:     ${SUPABASE_URL}

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (ingen Supabase SDK) ─────────────────────────────────────────

  frontend:
    build: .
    ports:
      - "5173:80"
    environment:
      VITE_API_GATEWAY_URL: http://localhost:8080
      VITE_MAPBOX_TOKEN:    ${MAPBOX_TOKEN}
    depends_on:
      - api-gateway

volumes:
  pgdata:
  miniodata:
  redisdata: